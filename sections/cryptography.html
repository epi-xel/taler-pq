<!-- Cryptographic building blocks: blind signatures, coins, withdrawing.
     Each empty div with an id is filled with assets/<id>.svg by logic/svg.js;
     matching data-id pairs auto-animate between consecutive slides. -->
<section id="cryptography" data-background-iframe="assets/section.html" data-transition="slide">
	<h2 class="stripe-title" style="margin:0;">
		A bit of cryptography
	</h2>
</section>
<section id="blind-signatures-1" data-background="var(--taler-bg)" data-auto-animate>
	<h3 data-id="bs-title" class="taler-title" style="margin: 30pt;">
		Blind Signatures (e-cash)
	</h3>
	<div id="blind-sig1" data-id="blind-sig" class="svg-step"></div>
</section>
<section id="blind-signatures-2" data-background="var(--taler-bg)" data-auto-animate>
	<h3 data-id="bs-title" class="taler-title" style="margin: 30pt;">
		Blind Signatures (e-cash)
	</h3>
	<div id="blind-sig2" data-id="blind-sig" class="svg-step"></div>
</section>
<section id="blind-signatures-3" data-background="var(--taler-bg)" data-auto-animate>
	<h3 data-id="bs-title" class="taler-title" style="margin: 30pt;">
		Blind Signatures (e-cash)
	</h3>
	<div id="blind-sig3" data-id="blind-sig" class="svg-step"></div>
</section>
<section id="coins-in-taler" data-background="var(--taler-bg)">
	<h3 class="taler-title" style="margin: 30pt;">
		Coins in Taler
	</h3>
	<div style="width:100%; height: 100%; display: flex; align-items: center; justify-content: center;">
		<div id="coin-struc" style="flex:1; display: block;"></div>
	</div>
</section>
<section id="withdraw-1" data-background="var(--taler-bg)" data-auto-animate>
	<h3 data-id="withdraw-title" class="taler-title" style="margin: 30pt;">
		Withdrawing coins
	</h3>
	<div id="withdraw1" data-id="withdraw" class="svg-step"></div>
</section>
<section id="withdraw-2" data-background="var(--taler-bg)" data-auto-animate>

<section id="withdraw-3" data-background="var(--taler-bg)" data-auto-animate>

	</h3>
	<div id="withdraw3" data-id="withdraw" class="svg-step"></div>
</section>
