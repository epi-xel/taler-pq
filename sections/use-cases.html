<!-- Use cases beyond a digital currency, and the live deployment map. -->
<section id="digital-currency" data-background="var(--taler-bg)" data-transition="slide" data-auto-animate>
	<h2 class="bold">
	Ideal to be used </br> as a digital currency
	</h2>
	<h2 data-id="not-only" class="fragment fade-up bold">
	...but not only
	</h2>
</section>
<section id="other-use-cases" data-background="var(--taler-bg)" data-transition="slide" data-auto-animate>
	<h2 data-id="not-only" class="taler-title">
	...but not only
	</h2>
	<!-- One equal-width card per use case, revealed top to bottom. -->
	<div class="card-stack">
		<div class="taler-card use-card fragment fade-down">
			<i class="bi bi-ticket-perforated"></i>
			<h3 class="card-label">Vouchers</h3>
		</div>
		<div class="taler-card use-card fragment fade-down">
			<i class="bi bi-credit-card"></i>
			<h3 class="card-label">Loyalty cards</h3>
		</div>
		<div class="taler-card use-card fragment fade-down">
			<i class="bi bi-person-check"></i>
			<h3 class="card-label">Online age verification</h3>
		</div>
		<div class="taler-card use-card fragment fade-down">
			<i class="bi bi-tv"></i>
			<h3 class="card-label">Streaming service subscriptions</h3>
		</div>
	</div>
</section>
<section id="deployed-real-world" data-background="var(--taler-bg)" data-transition="slide">
	<h2 class="taler-title">
	Deployed in real world!
	</h2>
	<h3 class="fragment fade bold">
	Switzerland only (for now)
	</h3>
</section>
<section id="taler-map" data-background-iframe="https://taler-ops.ch/en/map.html" data-background-interactive data-transition="fade">
</section>
