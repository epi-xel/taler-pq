<!-- Asymmetric privacy (on the gradient stripe) and Taler's three goal cards.
     Icons are <img data-themed> so svg.js can recolour them in dark. Styling:
     styles/sections.css. -->
<section id="asymmetric-privacy" data-background-iframe="assets/section.html" data-transition="slide">
	<div class="fragment fade-up">
		<h2 class="bold taler-blue privacy-label privacy-label-top">
		Customer
		</h2>
		<img data-themed class="privacy-icon privacy-icon-top" src="assets/incognito.svg" height="5%"/>
	</div>
	<h2 class="stripe-title">
		Asymmetric privacy
	</h2>
	<div class="fragment fade-down">
		<img data-themed class="privacy-icon privacy-icon-bottom" src="assets/surveillance.svg" height="5%"/>
		<h2 class="bold taler-blue privacy-label privacy-label-bottom">
		Merchant
		</h2>
	</div>
</section>
<section id="taler-goals" data-background="var(--taler-bg)" data-transition="slide">
	<!-- The real Taler logo stands in for the word "Taler". -->
	<h3 class="goals-title">
		<img data-themed class="goals-logo" src="assets/taler-logo-2021-plain.svg" alt="Taler"/><span class="goals-suffix">'s goals</span>
	</h3>
	<!-- One card per goal, revealed in order. -->
	<div class="card-grid">
		<div class="taler-card icon-card fragment fade-up" data-fragment-index="1">
			<div class="card-icon"><img data-themed src="assets/incognito.svg"/></div>
			<h5 class="goal-text">Customer's <strong>anonymity</strong></h5>
		</div>
		<div class="taler-card icon-card fragment fade-up" data-fragment-index="2">
			<div class="card-icon"><img data-themed src="assets/tax.svg"/></div>
			<h5 class="goal-text">Identified merchants (easily <strong>taxable</strong>)</h5>
		</div>
		<div class="taler-card icon-card fragment fade-up" data-fragment-index="3">
			<div class="card-icon"><img data-themed src="assets/aml.svg"/></div>
			<h5 class="goal-text"><strong>Anti-money laundering</strong> (AML)</h5>
		</div>
	</div>
</section>
