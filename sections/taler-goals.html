<!-- Asymmetric privacy (on the gradient stripe) and Taler's three goal cards.
     Icons are <img data-themed> so svg.js can recolour them in dark. -->
<section id="asymmetric-privacy" data-background-iframe="assets/section.html" data-transition="slide">
	<div class="fragment fade-up">
		<h2 class="bold taler-blue" style="margin-bottom:-10px;">
		Customer
		</h2>
		<img data-themed src="assets/incognito.svg" height="5%" style="display: block; margin: 0 auto 8%;"/>
	</div>
	<h2 class="stripe-title" style="margin:0;">
		Asymmetric privacy
	</h2>
	<div class="fragment fade-down">
		<img data-themed src="assets/surveillance.svg" height="5%" style="display: block; margin: 8% auto 0;"/>
		<h2 class="bold taler-blue" style="margin-top:-10px;">
		Merchant
		</h2>
	</div>
</section>
<section id="taler-goals" data-background="var(--taler-bg)" data-transition="slide">
	<style>
		#taler-goals .card-grid { --cols: 3; --col-width: 300px; gap: 40px; }
		#taler-goals .icon-card { padding: 28px 24px; }
		#taler-goals .card-icon img { height: 90px; }
		#taler-goals .goal-text { font-size: 22pt; font-weight: normal; margin: 0; }
	</style>
	<!-- The real Taler logo stands in for the word "Taler". vertical-align puts
	     the logo's letter baseline (60/90 of its height) on the text baseline; the
	     text uses the logo's own colour (--diagram-brand). -->
	<h3 style="margin: 30px 0 60px; white-space: nowrap;">
		<img data-themed src="assets/taler-logo-2021-plain.svg" alt="Taler"
			style="height: 110px; margin: 0; vertical-align: -36px; background: transparent;"/><span style="font-weight: bold; color: var(--diagram-brand);">'s goals</span>
	</h3>
	<!-- One card per goal, revealed in order. -->
	<div class="card-grid">
		<div class="taler-card icon-card fragment fade-up" data-fragment-index="1">
			<div class="card-icon"><img data-themed src="assets/incognito.svg"/></div>
			<h5 class="goal-text">Customer's <strong>anonymity</strong></h5>
		</div>
		<div class="taler-card icon-card fragment fade-up" data-fragment-index="2">
			<div class="card-icon"><img data-themed src="assets/tax.svg"/></div>
			<h5 class="goal-text">Identified merchants (easily <strong>taxable</strong>)</h5>
		</div>
		<div class="taler-card icon-card fragment fade-up" data-fragment-index="3">
			<div class="card-icon"><img data-themed src="assets/aml.svg"/></div>
			<h5 class="goal-text"><strong>Anti-money laundering</strong> (AML)</h5>
		</div>
	</div>
</section>
