<!-- Taler overview: "How does it work?" and the animated flow diagram.
     #diagram is filled with assets/diagram.svg by logic/svg.js and animated by
     logic/sections/diagram.js. -->
<!-- Washed photo: white wash (pre-baked PNG) in light; in dark, the photo
     (ecash-photo.jpg, the PNG with its wash undone) dimmed over the dark slide
     colour (data-dark-* swapped in by logic/main.js). -->
<section id="ecash" data-background="assets/ecash.png"
	data-dark-background="assets/ecash-photo.jpg" data-dark-background-color="var(--taler-bg)" data-dark-background-opacity="0.18"
	data-transition="fade">
	<h2 class="bold taler-blue" style="margin: 30pt;">
		How does Taler </br> “electronic cash” work?
	</h2>
</section>
<section id="overview" data-background="var(--taler-bg)" data-transition="slide">
	<div style="width:100%; display: flex; align-items: center; justify-content: center;">
		<div id="diagram" style="width: 70%; max-width: 100%; max-height: 100%; display: block;"></div>
	</div>
</section>
