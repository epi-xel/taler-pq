<!-- Title slide: logo, tagline, QR to the slides. Background is theme-aware
     (--taler-title-background); text on it stays white. In dark it's a neon
     sign (styles/document.css): the .frame-line SVG frames tagline + QR, open
     where the logo's rings cross its top line. -->
<section id="title" data-background-gradient="var(--taler-title-background)" data-id="mainbg" data-transition="slide">
	<div class="title-logo-row">
		<img data-themed class="title-logo" src="assets/taler-logo.svg"/>
	</div>
	<div class="title-row">
	<div class="title-panel">
		<svg class="frame-line" viewBox="0 0 835 365" aria-hidden="true">
			<path d="M523 1 H805 A29 29 0 0 1 834 30 V335 A29 29 0 0 1 805 364 H30 A29 29 0 0 1 1 335 V30 A29 29 0 0 1 30 1 H36"/>
		</svg>
		<h4 class="on-dark title-tagline">
			The regulable, </br> privacy-preserving, </br> post-quantum </br> digital payment system
		</h4>
		<div class="v-stack title-link">
			<h4 class="on-dark"> Slides @ </br> e.pioldi.net/ </br> taler-pq</h4>
			<img class="title-qr" src="assets/qr-slides.svg">
		</div>
	</div>
	</div>
</section>
