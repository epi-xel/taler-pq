<!DOCTYPE html>
<!-- Section-divider background (used via data-background-iframe): a blue→black
     stripe across the middle of the slide. The page colour follows the deck's
     theme (--taler-bg, read from the parent document); the stripe is fixed. -->
<html>
<head>
<style>
html, body {
	margin: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: white;
}

.stripe {
	position: absolute;

	top: 50%;

	width: 120%;
	height: 23vmin;

	transform: translateY(-50%);

	background: linear-gradient(to left, #0042b3, #222);
}

.stripe.animate {
    animation: moveUp 0.8s ease-out forwards;
}

</style>
</head>

<body>
	<div class="stripe"></div>
	<script>
	// Same-origin iframe: inherit the deck's slide background (light/dark).
	try {
		const bg = getComputedStyle(parent.document.documentElement).getPropertyValue('--taler-bg').trim();
		if (bg) document.documentElement.style.background = document.body.style.background = bg;
	} catch (e) { /* opened standalone or cross-origin: keep white */ }

	window.addEventListener('revealready', () => {
		document.querySelector('.stripe').classList.add('animate');
	});
	</script>
</body>
</html>
