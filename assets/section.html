<!DOCTYPE html>
<!-- Section-divider background (used via data-background-iframe): a blue→dark
     stripe across the middle of the slide. The page colour and the stripe's
     gradient follow the deck's theme (--taler-bg / --taler-stripe-*, read from
     the parent document). -->
<html>
<head>
<style>
html, body {
	margin: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: white;
}

.stripe {
	position: absolute;

	top: 50%;

	width: 120%;
	height: 23vmin;

	transform: translateY(-50%);

	background: linear-gradient(to left, #0042b3, #222);
}

.stripe.animate {
    animation: moveUp 0.8s ease-out forwards;
}

</style>
</head>

<body>
	<div class="stripe"></div>
	<script>
	// Same-origin iframe: inherit the deck's slide background (light/dark).
	// The deck calls this again after a theme switch (logic/theme-toggle.js).
	window.applyParentTheme = function () {
		try {
			const root = getComputedStyle(parent.document.documentElement);
			const bg = root.getPropertyValue('--taler-bg').trim();
			if (bg) document.documentElement.style.background = document.body.style.background = bg;
			const from = root.getPropertyValue('--taler-stripe-from').trim();
			const to = root.getPropertyValue('--taler-stripe-to').trim();
			if (from && to) document.querySelector('.stripe').style.background = 'linear-gradient(to left, ' + from + ', ' + to + ')';
		} catch (e) { /* opened standalone or cross-origin: keep white */ }
	};
	window.applyParentTheme();

	window.addEventListener('revealready', () => {
		document.querySelector('.stripe').classList.add('animate');
	});
	</script>
</body>
</html>
