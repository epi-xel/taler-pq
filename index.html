<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<title>GNU Taler</title>

		<!-- Vendored reveal.js (vendor/reveal/) -->
		<link rel="stylesheet" href="vendor/reveal/reset.css" />
		<link rel="stylesheet" href="vendor/reveal/reveal.css" />
		<!-- Theme for syntax-highlighted code -->
		<link rel="stylesheet" href="vendor/reveal/plugin/highlight/monokai.css" />

		<!-- Fonts / icons (vendored) -->
		<link rel="stylesheet" href="vendor/fonts/montserrat/montserrat.css" />
		<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">

		<!-- Our styles (styles/): reveal theme vars, dark-mode fixes for fixed-colour
		     images, and the shared styling for the section partials. -->
		<link rel="stylesheet" href="styles/theme.css" />
		<link rel="stylesheet" href="styles/document.css" />
		<link rel="stylesheet" href="styles/sections.css" />

		<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<!-- One vertical stack: the whole talk is navigated with Down/Space. -->
				<section>
					<div data-include="sections/title.html"></div>
					<div data-include="sections/why-taler.html"></div>
					<div data-include="sections/taler-goals.html"></div>
					<div data-include="sections/use-cases.html"></div>
					<div data-include="sections/overview.html"></div>
					<div data-include="sections/cryptography.html"></div>
					<div data-include="sections/payment-change.html"></div>
					<div data-include="sections/refresh.html"></div>
					<div data-include="sections/pq-refresh.html"></div>
					<div data-include="sections/the-end.html"></div>
				</section>
			</div>
		</div>

		<!-- Vendored reveal.js core + plugins -->
		<script src="vendor/reveal/reveal.js"></script>
		<script src="vendor/reveal/plugin/notes.js"></script>
		<script src="vendor/reveal/plugin/markdown.js"></script>
		<script src="vendor/reveal/plugin/highlight.js"></script>

		<!-- GSAP (vendored). Used by the diagram animation; main.js configures it. -->
		<script src="vendor/gsap/gsap.min.js"></script>

		<!-- All editable colours + light/dark MODE. Load before anything that reads it. -->
		<script src="theme.js"></script>

		<!-- App entry point. main.js loads the app's own logic scripts (section
		     loader, SVG loader, diagram animation — the list lives in main.js) in
		     order, then starts the deck. -->
		<script src="logic/main.js"></script>
	</body>
</html>
